            topics:
              type: integer
            prompts:
              type: integer
            mentions:
              type: integer
            answer_insights:
              type: integer
            competitor_snapshots:
              type: integer
            top_site_snapshots:
              type: integer
            trust_mentions:
              type: integer
            recommendations:
              type: integer
            ga4_snapshots:
              type: integer
            search_performance_snapshots:
              type: integer
