            type: string
        last_checked_at:
          type: [string, 'null']
          format: date-time
        connections:
          type: object
          description: Whether each source is connected.
          properties:
            ga4:
              type: boolean
            google_search_console:
              type: boolean
            bing_webmaster_tools:
              type: boolean
        connected_data:
          type: object
          description: Freshness of the newest stored snapshot per source.
          properties:
            ga4:
              $ref: '#/components/schemas/Freshness'
            google_search_console:
              $ref: '#/components/schemas/Freshness'
            bing_webmaster_tools:
